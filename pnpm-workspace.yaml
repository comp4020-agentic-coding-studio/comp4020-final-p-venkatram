# esbuild (used by Vitest) needs its postinstall to set up its native binary.
allowBuilds:
  # Just core-js's well-known postinstall donation banner (writes a harmless
  # dedup-timestamp file to the OS temp dir) — verified by reading its
  # postinstall.js before allowing.
  core-js: true
  esbuild: true
  # opensheetmusicdisplay's optional native WebGL binding, for headless
  # rendering in Node — this app only ever loads opensheetmusicdisplay in
  # the browser (src/lib/sheet-music.ts), never from the server process, so
  # there's no reason to compile a native module for it.
  gl: false
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.12.0'
  - '@astrojs/markdown-satteri@0.4.3'
  - astro@7.3.6
